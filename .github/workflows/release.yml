name: Test and release module

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wisoexport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax and regression tests
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php
      - name: Verify installable package
        run: python3 scripts/build-release.py

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build package and determine version
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/build-release.py "$REF_NAME"
          else
            python3 scripts/build-release.py
          fi
          archive=$(find dist -name '*.zip' -printf '%f\n')
          version=${archive#wisoexport-v}
          version=${version%.zip}
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish version once with installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; its assets remain unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --target "$RELEASE_COMMIT" \
            --title "WISO EÜR Export $RELEASE_TAG" \
            --notes-file .github/release-notes.md
